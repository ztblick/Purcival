<section class="goal-strip" aria-labelledby="goals-heading">
  <div class="goal-strip__masthead">
    <div>
      <p class="eyebrow">Purcival / Jo</p>
      <h1>{{ initial_title }}</h1>
    </div>
    {% if dashboard_authenticated %}
      <form class="session-form" action="/logout" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="session-button" type="submit">Log out</button>
      </form>
    {% endif %}
  </div>

  <div class="section-heading section-heading--compact">
    <h2 id="goals-heading">Goals</h2>
  </div>

  <div class="goal-grid">
    {% for category, category_goals in categories.items() %}
      {% for goal in category_goals %}
        {% include "partials/goal_card.html" %}
      {% endfor %}
    {% endfor %}
  </div>
</section>
