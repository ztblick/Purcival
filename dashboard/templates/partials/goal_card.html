<article class="goal-card {{ goal.category_class }}" data-goal-id="{{ goal.id }}">
  <div class="card-tag">{{ goal.category }}</div>
  <div class="goal-card__body">
    <h3>{{ goal.title }}</h3>
    {% if goal.highlight_step %}
      <p>{{ goal.highlight_step.title }}</p>
    {% else %}
      <p>Ready for Jo to suggest a concrete next step.</p>
    {% endif %}
  </div>
  <footer class="card-meta">
    <span>{{ goal.steps_in_progress_count }} steps in progress</span>
  </footer>
</article>
