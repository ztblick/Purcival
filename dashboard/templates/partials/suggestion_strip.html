<section id="steps-panel" class="suggestion-strip" aria-labelledby="suggestions-heading">
  {% if inbox_items %}
    <div class="section-heading">
      <h2>Inbox</h2>
    </div>

    <div class="inbox-list" aria-label="Proactive inbox">
      {% for item in inbox_items %}
        {% include "partials/inbox_card.html" %}
      {% endfor %}
    </div>
  {% endif %}

  <div class="section-heading">
    <h2 id="suggestions-heading">Steps</h2>
  </div>

  {% if activity_receipt %}
    <div class="activity-receipt" role="status">{{ activity_receipt }}</div>
  {% endif %}

  <div class="step-grid">
    {% for step in visible_steps %}
      {% include "partials/step_card.html" %}
    {% endfor %}
  </div>
</section>
