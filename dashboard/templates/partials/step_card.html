<article
  class="step-card step-card--{{ step.status }} {{ step.category_class }}"
  data-step-id="{{ step.id }}"
  data-chat-scope-type="{{ step.scope_type }}"
  data-chat-scope-id="{{ step.scope_id }}"
  role="button"
  tabindex="0"
>
  <div class="step-card__meta">
    <span class="card-tag card-tag--small">{{ step.category }}</span>
  </div>
  <p class="step-card__text">{{ step.display_text }}</p>

  {% if step.status == "suggested" %}
    <div class="step-actions" aria-label="Step decision controls">
      <form
        hx-post="/steps/{{ step.id }}/accept{{ filter_query_suffix }}"
        hx-target="#steps-panel"
        hx-swap="outerHTML"
      >
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="decision-button decision-button--accept" type="submit" title="Accept step" aria-label="Accept {{ step.title }}">&#10003;</button>
      </form>
      <form
        class="reject-form"
        hx-post="/steps/{{ step.id }}/reject{{ filter_query_suffix }}"
        hx-target="#steps-panel"
        hx-swap="outerHTML"
      >
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="decision-button decision-button--reject" type="submit" title="Reject step" aria-label="Reject {{ step.title }}">&#10005;</button>
      </form>
    </div>
  {% elif step.status == "accepted" %}
    <div class="step-actions" aria-label="Step accountability controls">
      <form
        hx-post="/steps/{{ step.id }}/complete{{ filter_query_suffix }}"
        hx-target="#steps-panel"
        hx-swap="outerHTML"
      >
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="decision-button decision-button--accept" type="submit" title="Mark done" aria-label="Mark {{ step.title }} done">&#10003;</button>
      </form>
      <form
        hx-post="/steps/{{ step.id }}/abandon{{ filter_query_suffix }}"
        hx-target="#steps-panel"
        hx-swap="outerHTML"
      >
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="decision-button decision-button--reject" type="submit" title="Abandon step" aria-label="Abandon {{ step.title }}">&#10005;</button>
      </form>
    </div>
  {% endif %}
</article>
