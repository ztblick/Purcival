<article class="step-card {{ step.category_class }}" data-step-id="{{ step.id }}">
  {% if step.goal %}
    <div class="card-tag card-tag--small">{{ step.goal.category }}</div>
  {% endif %}
  <h3>{{ step.title }}</h3>
  <div class="step-card__footer">
    {% if step.goal %}
      <span>{{ step.goal.title }}</span>
    {% endif %}
  </div>
</article>
