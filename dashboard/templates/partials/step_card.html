<article class="step-card" data-step-id="{{ step.id }}">
  {% if step.goal %}
    <div class="card-tag card-tag--small">{{ step.goal.category }}</div>
  {% endif %}
  <h3>{{ step.title }}</h3>
  {% if step.rationale %}
    <p>{{ step.rationale }}</p>
  {% endif %}
  <div class="step-card__footer">
    <div class="ghost-actions" aria-label="Step actions">
      <button type="button" disabled>Accept</button>
      <button type="button" disabled>Reject</button>
    </div>
    <span class="source-label">{{ step.source }}</span>
  </div>
</article>
